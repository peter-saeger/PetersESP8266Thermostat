<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lon's Shop Heat</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">

    <!-- Header: Clean Lon's Shop Heat -->
    <header class="header">
      <div class="brand">
        <h1>Lon's Shop Heat</h1>
      </div>
      <div class="status-badges">
        <span id="connectionBadge" class="badge badge-connecting">Connecting...</span>
      </div>
    </header>

    <!-- 1950s Tractor Instrument Cluster Chassis -->
    <main class="chassis-panel">
      <!-- Casing Bolts -->
      <div class="bolt bolt-tl"></div>
      <div class="bolt bolt-tr"></div>
      <div class="bolt bolt-bl"></div>
      <div class="bolt bolt-br"></div>

      <div class="cluster-grid">
        
        <!-- Left Panel: Status Lamp & 1950s Ivory Bat-Handle Plate Toggle Switches -->
        <div class="cluster-col col-left">
          
          <!-- Vintage Status Indicator Lamp -->
          <div class="indicator-lamp-card">
            <div class="lamp-bezel" id="lampBezel">
              <div class="lamp-lens">
                <span class="lamp-text-top">HEATER</span>
                <span class="lamp-text-bot" id="heatStatusText">STANDBY</span>
              </div>
            </div>
          </div>

          <!-- Dual 1950s Vertical Faceplate Ivory Bat-Handle Toggle Switches -->
          <div class="toggle-card">
            <div class="toggle-card-header">CONSOLE CONTROL</div>
            
            <div class="vintage-switches-row">
              
              <!-- Switch 1: POWER (ON [UP] / OFF [DOWN]) -->
              <div class="vintage-toggle-unit">
                <label class="vintage-plate-switch" for="powerToggle" title="Master Power Switch (ON / OFF)">
                  <input type="checkbox" id="powerToggle" checked onchange="onPowerToggleChange(this.checked)">
                  <div class="plate-bezel">
                    <div class="plate-top-label active-on" id="labelPowerOn">ON</div>
                    <div class="plate-hex-nut"></div>
                    <div class="plate-bat-lever"></div>
                    <div class="plate-bot-label" id="labelPowerOff">OFF</div>
                  </div>
                </label>
                <div class="plate-switch-title">POWER</div>
              </div>

              <!-- Switch 2: MODE (NORMAL [UP] / FREEZE PROTECT [DOWN]) -->
              <div class="vintage-toggle-unit">
                <label class="vintage-plate-switch" for="freezeToggle" title="Mode Switch (NORMAL / FREEZE PROTECT)">
                  <input type="checkbox" id="freezeToggle" onchange="onFreezeToggleChange(this.checked)">
                  <div class="plate-bezel plate-bezel-mode">
                    <div class="plate-top-label active-norm" id="labelNormal">NORMAL</div>
                    <div class="plate-hex-nut"></div>
                    <div class="plate-bat-lever"></div>
                    <div class="plate-bot-label label-freeze-pill" id="labelFreeze">FREEZE<br>PROTECT</div>
                  </div>
                </label>
                <div class="plate-switch-title">MODE</div>
              </div>

            </div>

            <div class="mode-status-text" id="modeStatusText">SYSTEM ACTIVE</div>
          </div>

        </div>

        <!-- Center Main 1950s Instrument Gauge Cluster (350px x 350px) -->
        <div class="cluster-col col-center">
          <div class="main-gauge-bezel">
            <div class="gauge-dial-face">
              
              <svg class="dial-svg" viewBox="0 0 240 240" id="dialSvg">
                <defs>
                  <linearGradient id="chromeBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="25%" stop-color="#cbd5e1"/>
                    <stop offset="50%" stop-color="#334155"/>
                    <stop offset="75%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#f8fafc"/>
                  </linearGradient>
                  <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2.5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                  </filter>
                </defs>

                <!-- Thin Chrome Bezel Outer Ring (r=117) -->
                <circle cx="120" cy="120" r="117" fill="none" stroke="url(#chromeBezelGrad)" stroke-width="3"/>

                <!-- Scale Tick Marks (r = 104 to 112) -->
                <g class="gauge-scale-ticks" stroke="#f7ebe1" opacity="0.55">
                  <line x1="46.5" y1="193.5" x2="40.8" y2="199.2" stroke-width="2" />
                  <line x1="16" y1="120" x2="8" y2="120" stroke-width="2" />
                  <line x1="46.5" y1="46.5" x2="40.8" y2="40.8" stroke-width="2" />
                  <line x1="120" y1="16" x2="120" y2="8" stroke-width="2" />
                  <line x1="193.5" y1="46.5" x2="199.2" y2="40.8" stroke-width="2" />
                  <line x1="224" y1="120" x2="232" y2="120" stroke-width="2" />
                  <line x1="193.5" y1="193.5" x2="199.2" y2="199.2" stroke-width="2" />
                </g>

                <!-- Scale Degree Numbers with Generous Padding from Chrome Border (r = 90) -->
                <g class="scale-degree-text" fill="#f7ebe1" font-size="14.5" font-weight="900" text-anchor="middle">
                  <text x="56" y="188">40°</text>
                  <text x="30" y="124">50°</text>
                  <text x="56" y="52">60°</text>
                  <text x="120" y="30">65°</text>
                  <text x="184" y="52">70°</text>
                  <text x="210" y="124">80°</text>
                  <text x="184" y="188">90°</text>
                </g>

                <!-- Active Range Arc Track Inward (Radius = 66, stroke-width = 5) -->
                <path d="M 73.33 166.67 A 66 66 0 1 1 166.67 166.67" fill="none" stroke="rgba(247,235,225,0.12)" stroke-width="5" stroke-linecap="round"/>
                <path id="activeTrack" d="M 73.33 166.67 A 66 66 0 0 1 166.67 166.67" fill="none" stroke="#f55300" stroke-width="5" stroke-linecap="round" filter="url(#glowOrange)"/>

                <!-- Pointer Needle -->
                <line id="tempNeedle" x1="120" y1="120" x2="120" y2="40" stroke="#ff9e00" stroke-width="3" stroke-linecap="round" filter="url(#glowOrange)"/>
                <circle cx="120" cy="120" r="6.5" fill="#1e293b" stroke="#ff9e00" stroke-width="2"/>

                <!-- Interactive Range Drag Handles (Radius = 66) -->
                <circle id="lowHandle" class="drag-handle" cx="73.33" cy="166.67" r="8.5" fill="#181e29" stroke="#f55300" stroke-width="2.5"/>
                <circle id="highHandle" class="drag-handle" cx="166.67" cy="166.67" r="8.5" fill="#181e29" stroke="#ff9e00" stroke-width="2.5"/>
              </svg>

              <!-- Center Digital Readout Box -->
              <div class="dial-center-box">
                <div class="digital-nixie-window">
                  <span id="currentTemp">--</span><span class="nixie-unit">&deg;F</span>
                </div>
                <div class="digital-nixie-subwindow">
                  <span id="currentHumidity">--</span><span class="nixie-sub-unit">% RH</span>
                </div>
                <div class="dial-gauge-title">SHOP THERMOSTAT</div>
              </div>

            </div>
          </div>
        </div>

        <!-- Right Control Panel Bay -->
        <div class="cluster-col col-right">
          <div class="target-controls-box">
            <div class="control-box-title">TEMPERATURE RANGE</div>

            <form id="boundsForm" onsubmit="event.preventDefault(); saveBounds();">
              
              <div class="setting-row">
                <label for="lowTempInput">HEATER ON (LOW)</label>
                <div class="gauge-stepper">
                  <button type="button" class="g-step-btn" onclick="stepBound('lowTempInput', -1)">&minus;</button>
                  <input type="number" id="lowTempInput" name="lowTemp" min="40" max="80" step="1" value="50" required>
                  <span class="g-unit">&deg;F</span>
                  <button type="button" class="g-step-btn" onclick="stepBound('lowTempInput', 1)">&plus;</button>
                </div>
              </div>

              <div class="setting-row">
                <label for="highTempInput">HEATER OFF (HIGH)</label>
                <div class="gauge-stepper">
                  <button type="button" class="g-step-btn" onclick="stepBound('highTempInput', -1)">&minus;</button>
                  <input type="number" id="highTempInput" name="highTemp" min="45" max="85" step="1" value="65" required>
                  <span class="g-unit">&deg;F</span>
                  <button type="button" class="g-step-btn" onclick="stepBound('highTempInput', 1)">&plus;</button>
                </div>
              </div>

              <button type="submit" class="metal-apply-btn" id="saveBtn">APPLY</button>
              <div id="formFeedback" class="form-feedback"></div>

            </form>
          </div>
        </div>

      </div>

    </main>

    <!-- History Chart Card -->
    <section class="card chart-card">
      <div class="bolt bolt-tl"></div>
      <div class="bolt bolt-tr"></div>
      <div class="bolt bolt-bl"></div>
      <div class="bolt bolt-br"></div>

      <div class="chart-header">
        <h2>Temperature History</h2>
        <button class="icon-btn" onclick="fetchHistory()" title="Refresh Chart">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
      <div class="chart-wrapper">
        <canvas id="tempChart"></canvas>
      </div>
    </section>

    <!-- Footer: IP, WiFi Signal, Uptime & OTA -->
    <footer class="footer">
      <div class="sys-info">
        <span>IP: <strong id="sysIp">--</strong></span>
        <span>WiFi Signal: <strong id="sysRssi">--</strong> dBm</span>
        <span>Uptime: <strong id="sysUptime">--</strong></span>
      </div>
      <div class="footer-actions">
        <a href="/update" class="badge badge-ota" title="Firmware Over-The-Air Update">OTA Update</a>
      </div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
