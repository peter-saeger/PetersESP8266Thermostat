<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lon's Shop Heat</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">

    <!-- Header: Clean Lon's Shop Heat -->
    <header class="header">
      <div class="brand">
        <h1>Lon's Shop Heat</h1>
      </div>
      <div class="status-badges">
        <span id="connectionBadge" class="badge badge-connecting">Connecting...</span>
      </div>
    </header>

    <!-- 1950s Tractor Instrument Cluster Chassis -->
    <main class="chassis-panel">
      <!-- Casing Bolts -->
      <div class="bolt bolt-tl"></div>
      <div class="bolt bolt-tr"></div>
      <div class="bolt bolt-bl"></div>
      <div class="bolt bolt-br"></div>

      <div class="cluster-grid">
        
        <!-- Left Panel: Status Lamp & 1950s Freeze Protect Toggle -->
        <div class="cluster-col col-left">
          
          <!-- Vintage Status Indicator Lamp -->
          <div class="indicator-lamp-card">
            <div class="lamp-bezel" id="lampBezel">
              <div class="lamp-lens">
                <span class="lamp-text-top">HEATER</span>
                <span class="lamp-text-bot" id="heatStatusText">STANDBY</span>
              </div>
            </div>
          </div>

          <!-- 1950s Toggle Switch Box: ON / FREEZE PROTECT -->
          <div class="toggle-card">
            <div class="toggle-card-header">MODE SELECT</div>
            
            <div class="vintage-switch-container">
              <span class="switch-label label-on" id="labelOn">ON</span>
              <label class="toggle-switch-collar" for="freezeToggle">
                <input type="checkbox" id="freezeToggle" onchange="onFreezeToggleChange(this.checked)">
                <span class="toggle-lever"></span>
              </label>
              <span class="switch-label label-freeze" id="labelFreeze">FREEZE<br>PROTECT</span>
            </div>

            <div class="mode-status-text" id="modeStatusText">NORMAL OPERATION</div>
          </div>

        </div>

        <!-- Center Main 1950s Instrument Gauge Cluster -->
        <div class="cluster-col col-center">
          <div class="main-gauge-bezel">
            <div class="gauge-dial-face">
              
              <svg class="dial-svg" viewBox="0 0 200 200" id="dialSvg">
                <defs>
                  <linearGradient id="chromeBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="25%" stop-color="#cbd5e1"/>
                    <stop offset="50%" stop-color="#334155"/>
                    <stop offset="75%" stop-color="#94a3b8"/>
                    <stop offset="100%" stop-color="#f8fafc"/>
                  </linearGradient>
                  <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                  </filter>
                </defs>

                <!-- Outer Thin Chrome Bezel Ring -->
                <circle cx="100" cy="100" r="97" fill="none" stroke="url(#chromeBezelGrad)" stroke-width="2.5"/>

                <!-- Outer Scale Tick Marks (r = 88 to 95) -->
                <g class="gauge-scale-ticks" stroke="#f7ebe1" opacity="0.5">
                  <line x1="37.8" y1="162.2" x2="32.8" y2="167.2" stroke-width="1.8" />
                  <line x1="12" y1="100" x2="5" y2="100" stroke-width="1.8" />
                  <line x1="37.8" y1="37.8" x2="32.8" y2="32.8" stroke-width="1.8" />
                  <line x1="100" y1="12" x2="100" y2="5" stroke-width="1.8" />
                  <line x1="162.2" y1="37.8" x2="167.2" y2="32.8" stroke-width="1.8" />
                  <line x1="188" y1="100" x2="195" y2="100" stroke-width="1.8" />
                  <line x1="162.2" y1="162.2" x2="167.2" y2="167.2" stroke-width="1.8" />
                </g>

                <!-- Scale Degree Numbers Outward near Ticks (r = 80, font-size = 12.5px) -->
                <g class="scale-degree-text" fill="#f7ebe1" font-size="12.5" font-weight="900" text-anchor="middle">
                  <text x="42" y="162">40°</text>
                  <text x="22" y="104">50°</text>
                  <text x="44" y="42">60°</text>
                  <text x="100" y="24">65°</text>
                  <text x="156" y="42">70°</text>
                  <text x="178" y="104">80°</text>
                  <text x="158" y="162">90°</text>
                </g>

                <!-- Active Range Arc Track Inward (Radius = 58, stroke-width = 4.5) -->
                <path d="M 58.99 141.01 A 58 58 0 1 1 141.01 141.01" fill="none" stroke="rgba(247,235,225,0.12)" stroke-width="4.5" stroke-linecap="round"/>
                <path id="activeTrack" d="M 58.99 141.01 A 58 58 0 0 1 141.01 141.01" fill="none" stroke="#f55300" stroke-width="4.5" stroke-linecap="round" filter="url(#glowOrange)"/>

                <!-- Pointer Needle -->
                <line id="tempNeedle" x1="100" y1="100" x2="100" y2="34" stroke="#ff9e00" stroke-width="2.5" stroke-linecap="round" filter="url(#glowOrange)"/>
                <circle cx="100" cy="100" r="5.5" fill="#1e293b" stroke="#ff9e00" stroke-width="2"/>

                <!-- Interactive Range Drag Handles (Radius = 58) -->
                <circle id="lowHandle" class="drag-handle" cx="58.99" cy="141.01" r="7.5" fill="#181e29" stroke="#f55300" stroke-width="2.5"/>
                <circle id="highHandle" class="drag-handle" cx="141.01" cy="141.01" r="7.5" fill="#181e29" stroke="#ff9e00" stroke-width="2.5"/>
              </svg>

              <!-- Center Digital Readout Box -->
              <div class="dial-center-box">
                <div class="digital-nixie-window">
                  <span id="currentTemp">--</span><span class="nixie-unit">&deg;F</span>
                </div>
                <div class="dial-gauge-title">SHOP THERMOSTAT</div>
              </div>

            </div>
          </div>
        </div>

        <!-- Right Control Panel Bay -->
        <div class="cluster-col col-right">
          <div class="target-controls-box">
            <div class="control-box-title">TEMPERATURE RANGE</div>

            <form id="boundsForm" onsubmit="event.preventDefault(); saveBounds();">
              
              <div class="setting-row">
                <label for="lowTempInput">HEATER ON (LOW)</label>
                <div class="gauge-stepper">
                  <button type="button" class="g-step-btn" onclick="stepBound('lowTempInput', -1)">&minus;</button>
                  <input type="number" id="lowTempInput" name="lowTemp" min="40" max="80" step="1" value="50" required>
                  <span class="g-unit">&deg;F</span>
                  <button type="button" class="g-step-btn" onclick="stepBound('lowTempInput', 1)">&plus;</button>
                </div>
              </div>

              <div class="setting-row">
                <label for="highTempInput">HEATER OFF (HIGH)</label>
                <div class="gauge-stepper">
                  <button type="button" class="g-step-btn" onclick="stepBound('highTempInput', -1)">&minus;</button>
                  <input type="number" id="highTempInput" name="highTemp" min="45" max="85" step="1" value="65" required>
                  <span class="g-unit">&deg;F</span>
                  <button type="button" class="g-step-btn" onclick="stepBound('highTempInput', 1)">&plus;</button>
                </div>
              </div>

              <button type="submit" class="metal-apply-btn" id="saveBtn">APPLY</button>
              <div id="formFeedback" class="form-feedback"></div>

            </form>
          </div>
        </div>

      </div>

      <!-- Bottom Console Summary Row -->
      <div class="switch-bar">
        <div class="console-readout">
          <div class="readout-pill">
            <span class="rp-lbl">TARGET LOW</span>
            <span class="rp-val" id="dispLowTemp">--&deg;F</span>
          </div>
          <div class="readout-pill">
            <span class="rp-lbl">TARGET HIGH</span>
            <span class="rp-val" id="dispHighTemp">--&deg;F</span>
          </div>
        </div>
      </div>

    </main>

    <!-- History Chart Card -->
    <section class="card chart-card">
      <div class="bolt bolt-tl"></div>
      <div class="bolt bolt-tr"></div>
      <div class="bolt bolt-bl"></div>
      <div class="bolt bolt-br"></div>

      <div class="chart-header">
        <h2>Temperature History</h2>
        <button class="icon-btn" onclick="fetchHistory()" title="Refresh Chart">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
      <div class="chart-wrapper">
        <canvas id="tempChart"></canvas>
      </div>
    </section>

    <!-- Footer: IP, WiFi Signal, Uptime & OTA -->
    <footer class="footer">
      <div class="sys-info">
        <span>IP: <strong id="sysIp">--</strong></span>
        <span>WiFi Signal: <strong id="sysRssi">--</strong> dBm</span>
        <span>Uptime: <strong id="sysUptime">--</strong></span>
      </div>
      <div class="footer-actions">
        <a href="/update" class="badge badge-ota" title="Firmware Over-The-Air Update">OTA Update</a>
      </div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
